name: Live contract check

# Calls the real E-Gen and OpenAI APIs (small cost) to catch upstream schema drift that the
# offline suite cannot see. Never runs on pull requests, so secrets are not exposed to forks.
on:
  schedule:
    - cron: "17 21 * * *" # 06:17 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-contract
  cancel-in-progress: false

jobs:
  live:
    name: Real API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ER_RUN_LIVE: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EGEN_SERVICE_KEY: ${{ secrets.EGEN_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require secrets (a missing secret must fail, not skip)
        run: |
          for name in OPENAI_API_KEY EGEN_SERVICE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::secret $name is not configured"; exit 1; fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run live contract tests
        run: python -m pytest tests/live -m live --no-cov -p no:cacheprovider --junitxml=live-results/junit.xml
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-contract
          path: live-results/
          if-no-files-found: ignore
      - name: Open an issue when the scheduled check fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Live contract check failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "E-Gen/OpenAI 실제 응답 계약 점검이 실패했습니다: $url"
          fi
