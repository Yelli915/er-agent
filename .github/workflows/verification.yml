name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy (strict)
        run: mypy src
  offline:
    name: Web and verification tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify Streamlit, API adapters and verification tooling
        run: python scripts/verify.py --scope web --output verification-results
      - name: Upload web verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-web
          path: verification-results/
          if-no-files-found: error
  integration:
    name: All modules integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify all modules and record integration blockers
        run: python scripts/verify.py --scope all --output verification-results
      - name: Upload complete verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-integration
          path: verification-results/
          if-no-files-found: error
